name: ProfoundSyntax Three Vendor
on:
  push:
    paths:
      - ".github/workflows/ps-three-vendor.yml"
      - "tmp/browser-3d-creator.js"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pin Three.js r187 and minify creator runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack three@0.187.0
          tar -xzf three-0.187.0.tgz
          cp package/build/three.module.js out/three-r187.module.js
          cp package/examples/jsm/controls/OrbitControls.js out/OrbitControls-r187.js
          cp package/examples/jsm/controls/TransformControls.js out/TransformControls-r187.js
          cp package/LICENSE out/three-LICENSE.txt
          cp tmp/browser-3d-creator.js out/browser-3d-creator.js
          npx --yes terser@5.44.0 out/three-r187.module.js -c -m -o out/three-r187.module.min.js
          npx --yes terser@5.44.0 out/OrbitControls-r187.js -c -m -o out/OrbitControls-r187.min.js --module
          npx --yes terser@5.44.0 out/TransformControls-r187.js -c -m -o out/TransformControls-r187.min.js --module
          npx --yes terser@5.44.0 out/browser-3d-creator.js -c -m -o out/browser-3d-creator.min.js --module
          sha256sum out/* | sort > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: profoundsyntax-three-r187
          path: out/
          if-no-files-found: error
          retention-days: 1
