name: ProfoundSyntax Creator 341b Bundle
on:
  push:
    paths:
      - ".github/workflows/ps-creator-341b.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bundle direct-drag creator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          npm install --no-save --ignore-scripts three@0.187.0 esbuild@0.25.11
          cp tmp/browser-3d-creator-341b.js out/browser-3d-creator.js
          npx esbuild tmp/browser-3d-creator-341b.js --bundle --minify --format=esm --platform=browser --outfile=out/browser-3d-creator.min.js
          node --check out/browser-3d-creator.js
          sha256sum out/* | sort > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: profoundsyntax-creator-341b
          path: out/
          if-no-files-found: error
          retention-days: 1
